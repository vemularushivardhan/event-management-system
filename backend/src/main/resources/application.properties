spring.application.name=event-management
server.port=8080

# MySQL Database Configuration (Environment variable overrides supported)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/event_management?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root2005}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Security Configuration
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Default Admin Seed Configuration (Created securely if no admin exists)
app.admin.default-email=${DEFAULT_ADMIN_EMAIL:admin@eventmanagement.com}
app.admin.default-password=${DEFAULT_ADMIN_PASSWORD:Admin@123}
app.admin.default-name=${DEFAULT_ADMIN_NAME:System Administrator}
app.admin.default-phone=${DEFAULT_ADMIN_PHONE:9876543210}
