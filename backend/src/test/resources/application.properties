spring.application.name=event-management-test

# H2 In-Memory Database for fast, deterministic unit & integration tests
spring.datasource.url=jdbc:h2:mem:event_management_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JWT Security Configuration for tests
