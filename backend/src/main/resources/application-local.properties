spring.application.name=event-management-local
server.port=8080

# In-Memory Database Profile for immediate testing without local MySQL password dependency
spring.datasource.url=jdbc:h2:mem:event_management;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JWT Security Configuration
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Default Admin Seed Configuration
app.admin.default-email=admin@eventmanagement.com
app.admin.default-password=Admin@123
app.admin.default-name=System Administrator
app.admin.default-phone=9876543210
